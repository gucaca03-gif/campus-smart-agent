<!DOCTYPE html>

<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home">
        <div class="brand-logo">苏</div>
        <div class="brand-text"><strong>苏小师</strong><span>SuMate · JSNU</span></div>
      </a>

      <nav class="side-nav" id="mainNav" aria-label="主导航">
        <a class="side-link" data-route="#/home" href="#/home">
          <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>
          主页<span class="side-badge">今日</span>
        </a>
        <a class="side-link" data-route="#/life/self/control" href="#/life/self/control">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 1.5M9 3h6M12 3v2.5"/></svg>
          自我控制
        </a>
        <a class="side-link side-link-ai" data-route="#/assistant" href="#/assistant">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
          苏小师
        </a>
        <a class="side-link" data-route="#/me" href="#/me">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4-5.2 7.5-5.2s6.1 1.6 7.5 5.2"/></svg>
          我的
        </a>
        <a class="side-link" data-route="#/hub" href="#/hub">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
          通道
        </a>
      </nav>

      <a class="note-entry" href="#/life/self/control?tab=notes" id="noteEntry">
        <span class="ne-ic">✎</span>
        <span class="ne-body"><b>随记</b><em id="noteEntrySub">随手记下，随时回看</em></span>

      </a>

      <div class="side-foot">
        <div class="side-links-mini">
          <a href="#/work/news">信息动态</a>
          <a href="#/resources">资源平台</a>

        </div>
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="打开菜单">☰</button>
      </div>
    </aside>

    <div class="shell-main">
      <header class="strip">
        <button class="icon-btn only-mobile" id="menuBtnM" aria-label="打开菜单">☰</button>
        <button class="icon-btn strip-back" id="backBtn" aria-label="返回上一页" hidden title="返回上一页">‹</button>
        <span class="strip-title">江苏师范大学 · 校园智慧服务平台</span>
        <div class="strip-right">
          <button class="icon-btn strip-vr" id="vrBtn" aria-label="VR校园" title="720° VR 云游校园">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><ellipse cx="12" cy="12" rx="8.2" ry="3.4"/><ellipse cx="12" cy="12" rx="3.4" ry="8.2"/><path d="M12 3.8v16.4" opacity=".55"/></svg>

          <button class="icon-btn strip-msg" id="msgBtn" aria-label="消息" title="消息中心">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-4.2 3.2c-.5.4-1.3 0-1.3-.6z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg>
            <span class="msg-dot" id="msgDot" hidden></span>
          </button>
          <button class="icon-btn" id="searchBtn" aria-label="搜索">⌕</button>
          <button class="avatar avatar-btn" id="meAvatar" title="我的" aria-label="我的">师</button>
        </div>
      </header>

      <main id="view" class="content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <a data-route="#/home" href="#/home"><span>⌂</span>首页</a>
    <a data-route="#/work" href="#/work"><span>▤</span>工作区</a>
    <a data-route="#/life" href="#/life"><span>◎</span>生活区</a>

  </nav>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <button class="todo-fab" id="todoFab" aria-label="今日任务" title="今日任务">
    <svg class="ring" viewBox="0 0 54 54" aria-hidden="true">
      <circle cx="27" cy="27" r="24" fill="none" stroke="#e4ebfa" stroke-width="4"/>
      <circle id="fabRing" cx="27" cy="27" r="24" fill="none" stroke="#1e5eff" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
    </svg>
    <span class="num" id="fabNum">--</span>
    <span class="lb">今日</span>
  </button>
  <div class="todo-panel" id="todoPanel">
    <div class="ph"><b>今日任务</b><span class="ph-sub">与自我控制联动</span><span class="pct" id="fabPct">0%</span></div>
    <div class="tlist" id="fabList"></div>
    <div class="pf"><span class="sync-tip">勾选即完成，同步自我控制</span><button id="fabGo">进入自我控制</button></div>
  </div>


  <script type="module" src="/static/js/app.js?v=20261124a"></script>
